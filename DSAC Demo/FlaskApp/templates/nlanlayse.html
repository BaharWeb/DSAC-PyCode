<script>
  $(document).ready(function() {
          $("#testForm").submit(function(event) {
              var rawText = $("#testinput").val();
              var userHtml = '<p class="boxuser sb1" ><span>' + rawText + "</span></p>";
              $("#text").val("");
              $("#chatbox").append(userHtml);
              document.getElementById("userInput").scrollIntoView({
                  block: "start",
                  behavior: "smooth",
              });
              $.ajax({
                  data: {
                      msg: rawText,
                  },
                  type: "POST",
                  url: "/getinput",
              }).done(function(data) {
                console.log(data);
                  if (data.includes("&lt")){
                    
                    if (data.includes(';')){
                      var domainText= data.substr(data.indexOf(';'));
                      domainText = domainText.replace(';',' ');
                      var dName = domainText.substr(0,domainText.indexOf('&'));
                      var dSim = domainText.substr(domainText.indexOf('&'));
                      dSim = dSim.replace('&', ': ');
                      dSim = "<br>" +"<i>" + "Similarity"+ dSim + "</i>";

                      $("#domain").html(dName);
                      $("#domain").append($.parseHTML(dSim));

                      var botText = data.substr(data.indexOf(':'), data.indexOf(';'));
                      botText = botText.substr(0,botText.indexOf(';'));
                      botText = botText.replace(';',' ');
                      var botHtml = '<p class = "box sb2" ><span>' + "DisCo: " + botText + "</span></p>";
                      $("#chatbox").append($.parseHTML(botHtml));

                    }else {
                      var botText = data.substr(data.indexOf(':'));
                      botText = botText.replace(':',' ');
                      var botHtml = '<p class = "box sb2" ><span>' + "DisCo: " + botText + "</span></p>";
                       $("#chatbox").append($.parseHTML(botHtml));
                    }
                    

                    var opText= data.substr(0, data.indexOf(':'));
                    

                    if (opText.split(')').length-1 > 1){
                      console.log("more operations")

                      var len = opText.split(')').length;
                      
                     
                      operations = opText.split(')');

                      for (i = 0; i < len-1; i++){
                        
                        var op = operations[i];
                        op= op.replace('(', ' ');
                        op = op.replace("&gt", '>');
                        op = op.substr(0, op.indexOf ('>')+1);
                        op= op.replace('&gt','><br>');
                        console.log(op);
                        op = "<tr ><td>"+ op +"</td></tr>";
                        $("#row").append($.parseHTML(op));
                        
                      }
                    }else {
                      opText = opText.replace('(', ' ');
                      opText = opText.replace("&gt", '>');
                      opText = opText.substr(0, opText.indexOf ('>')+1);
                      opText= opText.replace('&gt','><br>');
                      opText = "<tr ><td>"+ opText +"</td></tr>";
                      $("#row").append($.parseHTML(opText));
                    }


                  }else {
                    var botHtml = '<p class = "box sb2" ><span>' + "DisCo: " + data + "</span></p>";
                    $("#chatbox").append($.parseHTML(botHtml));

                  }
                  document.getElementById("userInput").scrollIntoView({
                      block: "start",
                      behavior: "smooth",
                  });
              });
              event.preventDefault();
              $('#testForm')[0].reset();
          });
      });

</script>
