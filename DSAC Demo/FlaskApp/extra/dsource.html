  <body>
<div class="container">
     <nav class="navbar navbar-inverse">

     <div class="row">
        <div class="jumbotron">
        <form id="upload-form" action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data">
            <p align="left"><strong>Files:</strong></p><br>
            <input id="file-picker" type="file" name="file" accept="text/plain" multiple>
            <div id="msg"></div>
            <input type="submit" class="btn btn-xs btn-default" value="Upload!" id="upload-button">
        </form>
        <br/>
        <b/>
        <form action = "http://localhost:5000/parse" method = "post">
                     <p>For extracing links for PDF files Enter the URL:</p>
                     <p><input type = "text" name = "url" /></p>
                     <p><input type = "submit" class="btn btn-xs btn-default" value = "submit" /></p>
                </form>
    </div>
        </div>
    </div>


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script>window.jQuery || document.write('<script src="../../assets/js/vendor/jquery.min.js"><\/script>')</script>
    <script src="../../dist/js/bootstrap.min.js"></script>
    <script src="../../assets/js/docs.min.js"></script>
    <!-- IE10 viewport hack for Surface/desktop Windows 8 bug -->
    <script src="../../assets/js/ie10-viewport-bug-workaround.js"></script>
    <script src="content/js/bootstrap.min.js"></script>
    <script>

    $("#file-picker").change(function(){

        var input = document.getElementById('file-picker');

        for (var i=0; i<input.files.length; i++)
        {
        //koala.jpg, koala.JPG substring(index) lastIndexOf('a') koala.1.jpg
            var ext= input.files[i].name.substring(input.files[i].name.lastIndexOf('.')+1).toLowerCase()

            if ((ext=='txt'))
            {
                $("#msg").text("Files are supported")
            }
            else
            {
                $("#msg").text("Files are NOT supported")
                document.getElementById("file-picker").value ="";
            }

        }


    } );

</script>
  </body>
